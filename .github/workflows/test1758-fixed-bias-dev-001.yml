name: Public test1758 fixed-bias development match001
on:
  push:
    branches: [research/test1758-fixed-bias-dev-001]
    paths: ['public-dev/**', '.github/workflows/test1758-fixed-bias-dev-001.yml']
permissions:
  contents: read
concurrency:
  group: test1758-fixed-bias-dev-001
  cancel-in-progress: false
jobs:
  fixed128pairs:
    if: github.repository == '0mis/Stockfish' && github.ref == 'refs/heads/research/test1758-fixed-bias-dev-001' && github.event.repository.private == false
    runs-on: windows-2022
    timeout-minutes: 350
    steps:
      - name: Checkout exact experiment commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12'
      - name: Install exact PGN validator
        run: python -m pip install --disable-pip-version-check chess==1.11.2
      - name: No-native driver fixtures
        run: python -B -m unittest discover -s public-dev -p test_driver.py -v
      - name: Fetch public inputs and reproduce fixed candidate
        run: python -B public-dev/prepare_inputs.py --plan-sha256 e67d024da0dc028cec1e772271ef5b074c43c67655efcbe171589eb6fac5ad95
      - name: Run fixed128reversed pairs at10plus0point1
        run: python -B public-dev/run_match.py --plan-sha256 e67d024da0dc028cec1e772271ef5b074c43c67655efcbe171589eb6fac5ad95
      - name: Independent full PGN and interval verification
        run: python -B public-dev/audit.py --plan-sha256 e67d024da0dc028cec1e772271ef5b074c43c67655efcbe171589eb6fac5ad95
      - name: Preserve all evidence including failures
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: test1758-fixed-bias-dev-001-${{ github.run_id }}
          path: evidence
          if-no-files-found: warn
          retention-days: 7
          compression-level: 9
