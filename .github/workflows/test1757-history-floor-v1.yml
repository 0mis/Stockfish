name: Test1757 history floor Windows evidence
on:
  push:
    branches: [research/test1757-history-floor-ci-v1]
permissions:
  contents: read
  actions: read
jobs:
  windows-bmi2:
    if: github.repository == '0mis/Stockfish'
    runs-on: windows-2022
    timeout-minutes: 45
    env:
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: core.autocrlf
      GIT_CONFIG_VALUE_0: 'false'
    steps:
      - name: Checkout triggering driver commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          path: driver
          persist-credentials: false
          fetch-depth: 1
      - name: Read frozen source record and test evidence checks
        id: pin
        shell: pwsh
        run: |
          $runnerPython = (Get-Command python -CommandType Application).Source
          "RUNNER_PYTHON=$runnerPython" >> $env:GITHUB_ENV
          & $runnerPython -B -m unittest discover -s driver/research/ci -p 'test_*.py'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $runnerPython -B driver/research/ci/build_and_capture_v1.py pin --github-output $env:GITHUB_OUTPUT
          exit $LASTEXITCODE
      - name: Checkout recorded candidate commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: 0mis/Stockfish
          ref: ${{ steps.pin.outputs.source_commit }}
          path: source
          persist-credentials: false
          fetch-depth: 1
      - name: Checkout selected prefetch baseline commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: 0mis/Stockfish
          ref: 7a17b53bcaf93f54a23ad65f309c413585500c82
          path: baseline
          persist-credentials: false
          fetch-depth: 1
      - name: Verify trees and package complete corresponding source and GPL
        shell: pwsh
        run: |
          & $env:RUNNER_PYTHON -B driver/research/ci/build_and_capture_v1.py prepare --driver-commit $env:GITHUB_SHA
          exit $LASTEXITCODE
      - name: Obtain accepted reference and its native capture
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          repository: 0mis/Stockfish
          run-id: 42543250921
          artifact-ids: '13642730885'
          merge-multiple: true
          digest-mismatch: error
          github-token: ${{ github.token }}
          path: reference
      - name: Set up MinGW64 without cache
        uses: msys2/setup-msys2@e9898307ac31d1a803454791be09ab9973336e1c
        with:
          msystem: MINGW64
          path-type: inherit
          cache: false
          install: mingw-w64-x86_64-gcc make git
      - name: Build and capture native checks
        shell: msys2 {0}
        run: |
          set -euo pipefail
          PYTHON_EXE="$(cygpath -u "$RUNNER_PYTHON")"
          "$PYTHON_EXE" -B driver/research/ci/build_and_capture_v1.py build --driver-commit "$GITHUB_SHA"
      - name: Record failure before a native summary
        if: failure()
        shell: pwsh
        run: |
          if (!(Test-Path artifact)) { New-Item -Type Directory artifact | Out-Null }
          if (!(Test-Path artifact/SUMMARY.json)) {
            @{status='workflow_stopped_before_native_summary';driver_commit=$env:GITHUB_SHA;run_id=$env:GITHUB_RUN_ID;run_attempt=$env:GITHUB_RUN_ATTEMPT;strength_claim=$false} |
              ConvertTo-Json | Set-Content -Encoding utf8NoBOM artifact/SUMMARY.json
          }
      - name: Upload candidate, source and captures
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: test1757-history-floor-windows-bmi2-${{ github.sha }}
          path: |
            artifact/stockfish-windows-x86-64-bmi2.exe
            artifact/*.stdout.txt
            artifact/*.stderr.txt
            artifact/*.record.json
            artifact/*.uci
            artifact/reference/donor-eval.stdout.txt
            artifact/reference/donor-eval.stderr.txt
            artifact/reference/donor-eval.record.json
            artifact/reference/donor-eval.uci
            artifact/SOURCE.json
            artifact/SUMMARY.json
            artifact/NATIVE-EVAL.json
            artifact/probes-v1.json
            artifact/source-pin.json
            artifact/AUTHORS
            artifact/Copying.txt
            artifact/corresponding-source.tar
          retention-days: 1
          if-no-files-found: error
          compression-level: 6
