name: Test1757 public sibling-move diagnostic v1

on:
  push:
    branches: [research/test1757-sibling-diagnostic-ci-v1]

permissions:
  contents: read
  actions: read

jobs:
  sibling-diagnostic:
    if: github.repository == '0mis/Stockfish'
    runs-on: windows-2022
    timeout-minutes: 50
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out the exact experiment
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Select CPython 3.11 x64
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.11.9'
          architecture: x64
          check-latest: false

      - name: Install the hash-pinned PyPI files
        run: |
          $pins = Get-Content -LiteralPath research/layout/requirements.txt
          $backend = Join-Path $env:RUNNER_TEMP 'layout-build-requirements.txt'
          $runtime = Join-Path $env:RUNNER_TEMP 'layout-runtime-requirements.txt'
          $pins | Where-Object { $_ -cmatch '^(setuptools|wheel) @ ' } | Set-Content -LiteralPath $backend -Encoding utf8NoBOM
          $pins | Where-Object { $_ -cmatch '^(numpy|chess) @ ' } | Set-Content -LiteralPath $runtime -Encoding utf8NoBOM
          $flags = @('--disable-pip-version-check', '--no-index', '--no-deps', '--no-cache-dir', '--require-hashes', '--force-reinstall')
          python -m pip --isolated install @flags -r $backend
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip --isolated install @flags --no-build-isolation -r $runtime
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          @'
          import struct
          import sys
          import chess
          import numpy

          assert sys.platform == "win32" and sys.version_info[:3] == (3, 11, 9) and struct.calcsize("P") == 8
          assert (numpy.__version__, chess.__version__) == ("2.4.6", "1.11.2")
          print(sys.version, numpy.__version__, chess.__version__)
          '@ | python -B -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Download the accepted prefetch artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          repository: 0mis/Stockfish
          run-id: 42543250921
          name: test1757-prefetch-windows-bmi2-49672d7b3c2b0cb544f4bf7cc70515249fe047e3
          github-token: ${{ github.token }}
          path: accepted-reference

      - name: Check out the two retired PGNs at their published commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: 0mis/stockfish-weight-space-lab
          ref: 6831500a4c6b22d64109a38bb0dc5bbf5b6f8fe0
          path: retired-public-games
          sparse-checkout: |
            /results/test1757-edited-screen/games-utc.pgn
            /results/test1757-parent-screen/games-utc.pgn
          sparse-checkout-cone-mode: false
          persist-credentials: false
          fetch-depth: 1

      - name: Verify all four experiment inputs
        id: inputs
        run: |
          if (Test-Path -LiteralPath layout-inputs-receipt.json) { throw 'Input receipt already exists' }
          python -B research/layout/fetch_inputs.py > layout-inputs-receipt.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-Content -Raw -LiteralPath layout-inputs-receipt.json

      - name: Test MultiPV parsing, score perspective and observation counts
        run: |
          $source = Join-Path $env:GITHUB_WORKSPACE 'research/sibling_diagnostic'
          $head = Join-Path $env:GITHUB_WORKSPACE 'research/head_calibration'
          $layout = Join-Path $env:GITHUB_WORKSPACE 'research/layout'
          $env:PYTHONPATH = @($source, $head, $layout) -join [System.IO.Path]::PathSeparator
          if (-not (Get-ChildItem -LiteralPath $source -File -Filter 'test_*.py')) { throw 'Missing diagnostic tests' }
          python -B -m unittest discover -s research/sibling_diagnostic -p 'test_*.py'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Measure the frozen public optimization positions
        run: |
          $head = Join-Path $env:GITHUB_WORKSPACE 'research/head_calibration'
          $layout = Join-Path $env:GITHUB_WORKSPACE 'research/layout'
          $env:PYTHONPATH = @($head, $layout) -join [System.IO.Path]::PathSeparator
          New-Item -ItemType Directory -Path evidence -ErrorAction Stop | Out-Null
          python -B research/sibling_diagnostic/experiment.py --execute --inputs inputs --output evidence --plan research/sibling_diagnostic/plan.json --plan-sha256 554ea5a418980ea9b21dc72e2835e9e367534d321052b67c3d9686f825b566ac
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path -LiteralPath evidence/RESULT.json -PathType Leaf)) { throw 'Missing result' }

      - name: Retain diagnostic data and raw scores
        if: ${{ always() && steps.inputs.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: test1757-sibling-diagnostic-${{ github.sha }}
          path: |
            evidence/
            layout-inputs-receipt.json
            !evidence/**/*.exe
            !evidence/**/*.nnue
          retention-days: 1
          if-no-files-found: error
