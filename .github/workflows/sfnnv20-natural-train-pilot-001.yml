name: Current SFNNv20 fixed TRAIN calibration pilot

on:
  push:
    branches:
      - research/sfnnv20-natural-play-calibration-001
    paths:
      - .github/workflows/sfnnv20-natural-train-pilot-001.yml
      - research/sfnnv20_natural_play/train_pilot.py
      - research/sfnnv20_natural_play/teacher_protocol.py
      - research/sfnnv20_natural_play/test_train_pilot.py

permissions:
  contents: read
  actions: read

concurrency:
  group: sfnnv20-natural-fixed-train-pilot-001
  cancel-in-progress: false

jobs:
  pilot:
    if: github.repository == '0mis/Stockfish' && github.ref == 'refs/heads/research/sfnnv20-natural-play-calibration-001'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - name: Checkout exact isolated pilot driver
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          path: driver
          persist-credentials: false
          fetch-depth: 1
      - name: Use CPython 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install exact hashed legal-replay tools
        shell: bash
        run: |
          set -euo pipefail
          sed -n '/^setuptools @/p; /^wheel @/p' driver/research/sfnnv20_natural_play/requirements.txt > "$RUNNER_TEMP/bootstrap.txt"
          python -m pip install --disable-pip-version-check --no-cache-dir --no-deps --require-hashes -r "$RUNNER_TEMP/bootstrap.txt"
          python -m pip install --disable-pip-version-check --no-cache-dir --no-deps --no-build-isolation --require-hashes -r driver/research/sfnnv20_natural_play/requirements.txt
      - name: Verify fixed pilot and source contracts
        shell: bash
        run: python -B -m unittest discover -s driver/research/sfnnv20_natural_play -p 'test_*.py' -v
      - name: Run exact128-component TRAIN pilot after source and Root admission gates
        shell: bash
        run: |
          set -euo pipefail
          python -B driver/research/sfnnv20_natural_play/train_pilot.py --out sfnnv20-natural-train-pilot-evidence
      - name: Preserve actual teacher/capture/ordinary parity and usage traces
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sfnnv20-natural-fixed-train-pilot
          path: sfnnv20-natural-train-pilot-evidence/
          if-no-files-found: error
          retention-days: 90
          compression-level: 6
          include-hidden-files: true
