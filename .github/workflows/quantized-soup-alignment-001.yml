name: Quantized soup coordinate alignment001

on:
  push:
    branches: [research/test1758-quantized-soup-pilot-001]
    paths:
      - research/quantized_soup_001/plan.json
      - research/quantized_soup_001/alignment.py
      - research/quantized_soup_001/test_alignment.py
      - .github/workflows/quantized-soup-alignment-001.yml

permissions:
  contents: read

concurrency:
  group: quantized-soup-alignment-001
  cancel-in-progress: false

jobs:
  alignment:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      OPENBLAS_NUM_THREADS: '2'
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      PYTHONDONTWRITEBYTECODE: '1'
      PLAN_SHA256: 65ac8dfc852a7e80b20469a68f06469b9f151cef65202147e2496bf4923053ba
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install bounded numerical tooling
        run: |
          python -m pip install --disable-pip-version-check --only-binary=:all: numpy==2.2.6 scipy==1.15.3
      - name: Verify synthetic signs, symmetries, support and serialized geometry
        shell: bash
        run: |
          set -o pipefail
          python -B -m unittest discover -s research/quantized_soup_001 -p test_alignment.py -v 2>&1 | tee "$RUNNER_TEMP/quantized-soup-tests.txt"
      - name: Bind original source and measured code
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/xu-shawn/Stockfish/compare/d5a2bda7f028430f79e1789d47ae3228defb843b...73fe1eaca99ac4a09252c876aa6b1cceeaf7c4c7 > "$RUNNER_TEMP/upstream-source-compare.json"
          python - <<'PY'
          import hashlib,json,os,pathlib
          files=['research/quantized_soup_001/plan.json','research/quantized_soup_001/alignment.py','research/quantized_soup_001/test_alignment.py','research/layout/permute_nnue.py','.github/workflows/quantized-soup-alignment-001.yml']
          refs={p:{'bytes':pathlib.Path(p).stat().st_size,'sha256':hashlib.sha256(pathlib.Path(p).read_bytes()).hexdigest()} for p in files}
          assert refs[files[0]]['sha256']==os.environ['PLAN_SHA256']
          upstream=json.loads((pathlib.Path(os.environ['RUNNER_TEMP'])/'upstream-source-compare.json').read_bytes())
          assert [f['filename'] for f in upstream['files']]==['src/evaluate.h']
          (pathlib.Path(os.environ['RUNNER_TEMP'])/'method-source-pins.json').write_text(json.dumps({'commit':os.environ['GITHUB_SHA'],'files':refs,'upstream_only_default_network_diff':True},indent=2)+'\n')
          PY
      - name: Measure precommitted identity alignment only
        shell: bash
        run: |
          set -o pipefail
          python -B research/quantized_soup_001/alignment.py --expected-plan-sha "$PLAN_SHA256" --work "$RUNNER_TEMP/quantized-soup-001" 2>&1 | tee "$RUNNER_TEMP/quantized-soup-alignment.log"
      - name: Retain complete negative or positive alignment evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: quantized-soup-alignment-${{ github.sha }}
          path: |
            ${{ runner.temp }}/quantized-soup-001/evidence
            ${{ runner.temp }}/quantized-soup-tests.txt
            ${{ runner.temp }}/quantized-soup-alignment.log
            ${{ runner.temp }}/method-source-pins.json
            ${{ runner.temp }}/upstream-source-compare.json
          if-no-files-found: error
          retention-days: 7
